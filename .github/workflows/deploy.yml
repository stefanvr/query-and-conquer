name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # No build step for v1 (tech-stack.md: plain HTML/CSS/JS, native ES modules) —
          # the repo root, minus dev-only and doc-only content, is the deployable site.
          path: "."
          exclude: |
            doc
            dev
            test
            e2e
            node_modules
            .github
      - id: deployment
        uses: actions/deploy-pages@v4
