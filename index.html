<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Query and Conquer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <div id="screen-start" class="screen-view">
    <div class="screen">
      <div class="title">QUERY &amp; <span>CONQUER</span></div>
      <button id="start-button" class="btn-primary">Start</button>
    </div>
  </div>

  <div id="screen-main-menu" class="screen-view" hidden>
    <div class="menu-panel">
      <h1 class="menu-title">Main Menu</h1>
      <div class="menu-stack">
        <button id="new-game-button" class="btn-primary">New Game</button>
        <button id="load-game-button" class="btn-primary" disabled>Load Game</button>
        <button id="load-test-game-button" class="btn-primary" hidden>Load Test Game (dev)</button>
      </div>
    </div>
  </div>

  <div id="screen-options" class="screen-view" hidden>
    <div class="menu-panel">
      <h1 class="menu-title">Game Options</h1>
      <form id="options-form" class="options-form">
        <label>AI opponents
          <select id="opt-ai-count"></select>
        </label>
        <div id="opt-ai-difficulties" class="ai-difficulties"></div>
        <label>Map size
          <select id="opt-map-size"></select>
        </label>
        <label>Map type
          <select id="opt-map-type"></select>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="opt-fog" checked>
          Fog of war
        </label>
      </form>
      <div class="menu-stack">
        <button id="start-match-button" class="btn-primary">Start Match</button>
        <button id="options-back-button" class="btn-primary">Back</button>
      </div>
    </div>
  </div>

  <div id="screen-game" class="screen-view" hidden>
    <div id="hud">
      <span id="hud-turn-indicator"></span>
      <!-- Shown while a plane still owes its mandatory movement this turn (implementation-spec.md
           §6/§3's Plane rearm & fuel) -- disables End Turn alongside it. -->
      <span id="hud-end-turn-blocked" class="menu-body-text" hidden></span>
      <button id="end-turn-button" class="btn-primary">End Turn</button>
      <button id="menu-button" class="btn-primary">Menu</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="map-canvas"></canvas>
      <div class="zoom-controls">
        <button id="zoom-in-button" type="button">+</button>
        <button id="zoom-out-button" type="button">&minus;</button>
      </div>
      <div id="base-panel" class="side-panel" hidden>
        <button id="base-panel-close" class="side-panel-close" type="button" aria-label="Close">&times;</button>
        <h2 id="base-panel-title" class="side-panel-title"></h2>
        <p id="base-panel-owner" class="menu-body-text"></p>
        <!-- Only your own base's interior state is ever shown (implementation-spec.md §2/§4) --
             an enemy base's panel stops at type + owner above. -->
        <div id="base-panel-own-details">
          <p id="base-panel-sp" class="menu-body-text"></p>
          <p id="base-panel-capacity" class="menu-body-text"></p>
          <p class="base-panel-section-label">Building</p>
          <div id="base-panel-build-slot" class="slot-grid"></div>
          <p class="base-panel-section-label">Queue</p>
          <div id="base-panel-queue" class="slot-grid"></div>
          <p class="base-panel-section-label">Garrison</p>
          <div id="base-panel-garrison" class="slot-grid"></div>
          <div id="base-panel-build-buttons" class="base-panel-build-buttons"></div>
        </div>
      </div>
      <div id="unit-panel" class="side-panel" hidden>
        <button id="unit-panel-close" class="side-panel-close" type="button" aria-label="Close">&times;</button>
        <h2 id="unit-panel-title" class="side-panel-title"></h2>
        <p id="unit-panel-sp" class="menu-body-text"></p>
        <p id="unit-panel-ap" class="menu-body-text"></p>
        <!-- Only for a plane (roundTripRange set, implementation-spec.md §3's Plane rearm & fuel) -->
        <p id="unit-panel-strikes" class="menu-body-text" hidden></p>
        <p id="unit-panel-fuel" class="menu-body-text" hidden></p>
        <!-- Only for a boat (holdCapacity > 0, implementation-spec.md §3) -->
        <div id="unit-panel-cargo-section" hidden>
          <p class="base-panel-section-label">Cargo</p>
          <div id="unit-panel-cargo" class="slot-grid"></div>
        </div>
        <div id="unit-panel-actions" class="base-panel-build-buttons"></div>
      </div>
    </div>
    <div id="mid-turn-menu" hidden>
      <div class="menu-panel" id="mid-turn-menu-main">
        <h1 class="menu-title">Menu</h1>
        <div class="menu-stack">
          <button id="save-button" class="btn-primary">Save</button>
          <button id="surrender-button" class="btn-primary">Surrender</button>
          <button id="quit-button" class="btn-primary">Quit</button>
          <button id="menu-close-button" class="btn-primary">Close</button>
        </div>
      </div>
      <div class="menu-panel" id="surrender-confirm" hidden>
        <h1 class="menu-title">Surrender?</h1>
        <p class="menu-body-text">This ends the match immediately and cannot be undone.</p>
        <div class="menu-stack">
          <button id="surrender-confirm-yes" class="btn-primary">Yes, Surrender</button>
          <button id="surrender-confirm-cancel" class="btn-primary">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reached on a natural win/loss or a surrender (implementation-spec.md §8's End screen) --
       full map reveal, read-only: no HUD interaction beyond pan/zoom, Stats, and Main Menu. -->
  <div id="screen-end" class="screen-view" hidden>
    <div id="end-hud">
      <span id="end-result"></span>
      <button id="end-stats-button" class="btn-primary">Stats</button>
      <button id="end-main-menu-button" class="btn-primary">Main Menu</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="end-map-canvas"></canvas>
      <div class="zoom-controls">
        <button id="end-zoom-in-button" type="button">+</button>
        <button id="end-zoom-out-button" type="button">&minus;</button>
      </div>
    </div>
    <div id="end-stats-overlay" hidden>
      <div class="menu-panel">
        <h1 class="menu-title">Stats</h1>
        <div id="end-stats-rows" class="menu-stack"></div>
        <div class="menu-stack">
          <button id="end-stats-close-button" class="btn-primary">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
