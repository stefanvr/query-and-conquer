<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Query and Conquer — Dev Style Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
<!-- Pulls the app's own tokens/CSS, not a hand-copied duplicate — see
     doc/implementation-spec.md §8 "Dev style guide page". -->
<link rel="stylesheet" href="../src/styles/tokens.css">
<link rel="stylesheet" href="../src/styles/main.css">
<style>
  /* Dev-page-only chrome — not shipped app UI. */
  body { display: block; padding: 24px 12px 60px; }

  main { max-width: 640px; margin: 0 auto; }

  .screen { margin: 0 auto; }

  .section { margin-top: 44px; }

  .section h2 {
    font-family: var(--font-display);
    font-size: 18px;
    letter-spacing: 0.06em;
    color: var(--parchment);
    border-bottom: 1px solid var(--olive);
    padding-bottom: 6px;
    margin-bottom: 14px;
  }

  .swatch-row { display: flex; gap: 14px; flex-wrap: wrap; }

  .swatch-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .swatch-label {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--steel);
  }

  .hex {
    width: 44px;
    height: 38px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
  }

  .dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.35);
  }

  .gras { background: var(--t-gras); }
  .gravel { background: var(--t-gravel); }
  .mountain { background: var(--t-mountain); }
  .sand { background: var(--t-sand); }
  .shallow { background: var(--t-shallow); }
  .deep { background: var(--t-deep); }

  .p-human { background: var(--p-human); }
  .p-ai-1 { background: var(--p-ai-1); }
  .p-ai-2 { background: var(--p-ai-2); }
  .p-ai-3 { background: var(--p-ai-3); }
  .p-ai-4 { background: var(--p-ai-4); }
  .p-ai-5 { background: var(--p-ai-5); }

  /* Fog of war demo — the three states from style-guide.md §7. */
  .fog-row { display: flex; gap: 4px; }

  .fog-tile {
    position: relative;
    width: 64px;
    height: 56px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: var(--t-gras);
  }

  .fog-tile.unexplored { background: var(--ink); }

  .fog-tile.explored::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.30); /* 30% dim, per spec */
  }

  .fog-caption { display: flex; gap: 4px; margin-top: 6px; }

  .fog-caption span {
    width: 64px;
    font-size: 10px;
    text-align: center;
    color: var(--steel);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* Phase-1 text-only status treatment — style-guide.md §8. */
  .status-demo { display: flex; gap: 28px; }

  .status-tile {
    position: relative;
    width: 72px;
    height: 62px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: var(--t-sand);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .status-marker {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--p-ai-1);
    box-shadow: 0 0 0 2px var(--ink);
  }

  .status-label {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--parchment);
    background: var(--ink);
    padding: 1px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<main>
  <h1 style="font-family: var(--font-display); letter-spacing: 0.06em;">
    Dev Style Guide <span style="color: var(--steel); font-family: var(--font-body); font-size: 14px; letter-spacing: normal;">— not part of the shipped app</span>
  </h1>

  <div class="section">
    <h2>Start screen</h2>
    <div class="screen">
      <div class="title">QUERY &amp; <span>CONQUER</span></div>
      <button class="btn-primary">Start</button>
    </div>
  </div>

  <div class="section">
    <h2>Terrain tiles</h2>
    <div class="swatch-row">
      <div class="swatch-item"><div class="hex gras"></div><div class="swatch-label">Gras</div></div>
      <div class="swatch-item"><div class="hex gravel"></div><div class="swatch-label">Gravel</div></div>
      <div class="swatch-item"><div class="hex mountain"></div><div class="swatch-label">Mountain</div></div>
      <div class="swatch-item"><div class="hex sand"></div><div class="swatch-label">Sand</div></div>
      <div class="swatch-item"><div class="hex shallow"></div><div class="swatch-label">Shallow</div></div>
      <div class="swatch-item"><div class="hex deep"></div><div class="swatch-label">Deep</div></div>
    </div>
  </div>

  <div class="section">
    <h2>Player accents</h2>
    <div class="swatch-row">
      <div class="swatch-item"><div class="dot p-human"></div><div class="swatch-label">Human</div></div>
      <div class="swatch-item"><div class="dot p-ai-1"></div><div class="swatch-label">AI 1</div></div>
      <div class="swatch-item"><div class="dot p-ai-2"></div><div class="swatch-label">AI 2</div></div>
      <div class="swatch-item"><div class="dot p-ai-3"></div><div class="swatch-label">AI 3</div></div>
      <div class="swatch-item"><div class="dot p-ai-4"></div><div class="swatch-label">AI 4</div></div>
      <div class="swatch-item"><div class="dot p-ai-5"></div><div class="swatch-label">AI 5</div></div>
    </div>
  </div>

  <div class="section">
    <h2>Fog of war</h2>
    <div class="fog-row">
      <div class="fog-tile unexplored"></div>
      <div class="fog-tile explored"></div>
      <div class="fog-tile"></div>
    </div>
    <div class="fog-caption">
      <span>Unexplored</span>
      <span>Explored (dim 30%)</span>
      <span>Visible</span>
    </div>
  </div>

  <div class="section" style="padding-bottom: 40px;">
    <h2>Phase 1 status text</h2>
    <div class="status-demo">
      <div class="status-tile">
        <div class="status-marker"></div>
        <div class="status-label">7/10 SP</div>
      </div>
      <div class="status-tile">
        <div class="status-marker"></div>
        <div class="status-label">[SELECTED]</div>
      </div>
      <div class="status-tile">
        <div class="status-label">IN RANGE</div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
