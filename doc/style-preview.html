    right: 0;
    text-align: center;
    font-family: "Staatliches", system-ui, sans-serif;
    font-size: clamp(28px, 6vw, 42px);
    letter-spacing: 0.06em;
    color: var(--parchment);
    text-shadow: 0 2px 0 var(--ink), 0 0 24px rgba(0,0,0,0.9);
  }

  .title span {
    color: var(--signal);
  }

  .start-btn {
    font-family: "Staatliches", system-ui, sans-serif;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: var(--ink);
    background: var(--signal);
    border: none;
    padding: 14px 48px;
    border-radius: 6px;
    box-shadow: 0 4px 0 var(--rust), 0 6px 14px rgba(0,0,0,0.6);
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .start-btn:hover {
    transform: translateY(2px);
    box-shadow: 0 2px 0 var(--rust), 0 4px 10px rgba(0,0,0,0.6);
  }

  .start-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--rust);
  }

  /* --- Terrain legend ("recon key") --- */
  .legend {
    margin-top: 36px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 640px;
  }

  .legend-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .hex {
    width: 44px;
    height: 38px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
  }

  .legend-label {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--steel);
  }

  .gras { background: var(--t-gras); }
  .gravel { background: var(--t-gravel); }
  .mountain { background: var(--t-mountain); }
  .sand { background: var(--t-sand); }
  .shallow { background: var(--t-shallow); }
  .deep { background: var(--t-deep); }

  /* --- Extra reference sections --- */
  .section {
    margin-top: 44px;
    max-width: 640px;
  }

  .section h2 {
    font-family: "Staatliches", system-ui, sans-serif;
    font-size: 18px;
    letter-spacing: 0.06em;
    color: var(--parchment);
    border-bottom: 1px solid var(--olive);
    padding-bottom: 6px;
    margin-bottom: 14px;
  }

  /* Player accent swatches */
  .players {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .player-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .player-dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35);
  }

  .p-human { background: var(--p-human); }
  .p-ai-1 { background: var(--p-ai-1); }
  .p-ai-2 { background: var(--p-ai-2); }
  .p-ai-3 { background: var(--p-ai-3); }
  .p-ai-4 { background: var(--p-ai-4); }
  .p-ai-5 { background: var(--p-ai-5); }

  /* Fog of war demo strip */
  .fog-row {
    display: flex;
    gap: 4px;
  }

  .fog-tile {
    position: relative;
    width: 64px;
    height: 56px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: var(--t-gras);
  }

  .fog-tile.unexplored {
    background: var(--ink);
  }

  .fog-tile.explored::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.30); /* 30% dim, per spec */
  }

  .fog-caption {
    display: flex;
    gap: 4px;
    margin-top: 6px;
  }

  .fog-caption span {
    width: 64px;
    font-size: 10px;
    text-align: center;
    color: var(--steel);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* Phase-1 text-only unit status demo */
  .unit-demo {
    display: flex;
    gap: 28px;
    align-items: flex-start;
  }

  .unit-tile {
    position: relative;
    width: 72px;
    height: 62px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: var(--t-sand);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .unit-marker {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--p-ai-1);
    box-shadow: 0 0 0 2px var(--ink);
  }

  .status-label {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--parchment);
    background: var(--ink);
    padding: 1px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }
</style>
</head>
<body>

  <div>
    <div class="screen">
      <div class="title">QUERY &amp; <span>CONQUER</span></div>
      <button class="start-btn">Start</button>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="hex gras"></div><div class="legend-label">Gras</div></div>
      <div class="legend-item"><div class="hex gravel"></div><div class="legend-label">Gravel</div></div>
      <div class="legend-item"><div class="hex mountain"></div><div class="legend-label">Mountain</div></div>
      <div class="legend-item"><div class="hex sand"></div><div class="legend-label">Sand</div></div>
      <div class="legend-item"><div class="hex shallow"></div><div class="legend-label">Shallow</div></div>
      <div class="legend-item"><div class="hex deep"></div><div class="legend-label">Deep</div></div>
    </div>

    <div class="section">
      <h2>Player accents</h2>
      <div class="players">
        <div class="player-item"><div class="player-dot p-human"></div><div class="legend-label">Human</div></div>
        <div class="player-item"><div class="player-dot p-ai-1"></div><div class="legend-label">AI 1</div></div>
        <div class="player-item"><div class="player-dot p-ai-2"></div><div class="legend-label">AI 2</div></div>
        <div class="player-item"><div class="player-dot p-ai-3"></div><div class="legend-label">AI 3</div></div>
        <div class="player-item"><div class="player-dot p-ai-4"></div><div class="legend-label">AI 4</div></div>
        <div class="player-item"><div class="player-dot p-ai-5"></div><div class="legend-label">AI 5</div></div>
      </div>
    </div>

    <div class="section">
      <h2>Fog of war</h2>
      <div class="fog-row">
        <div class="fog-tile unexplored"></div>
        <div class="fog-tile explored"></div>
        <div class="fog-tile"></div>
      </div>
      <div class="fog-caption">
        <span>Unexplored</span>
        <span>Explored (dim 30%)</span>
        <span>Visible</span>
      </div>
    </div>

    <div class="section" style="padding-bottom: 40px;">
      <h2>Phase 1 status text</h2>
      <div class="unit-demo">
        <div class="unit-tile">
          <div class="unit-marker"></div>
          <div class="status-label">7/10 SP</div>
        </div>
        <div class="unit-tile">
          <div class="unit-marker"></div>
          <div class="status-label">[SELECTED]</div>
        </div>
        <div class="unit-tile">
          <div class="status-label">IN RANGE</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
